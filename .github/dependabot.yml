version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Recompile localement avec zstd (build_tantivy_zstd.ps1) et lie a la
      # version du crate Rust de l'indexeur : montee de version manuelle.
      - dependency-name: "tantivy"
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/indexer"
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
