name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt -r bot/requirements-dev.txt
      - name: Ruff
        run: python -m ruff check backend bot
      - name: Pytest
        run: python -m pytest backend/tests bot/tests -q
      - name: Dependency audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Dependency audit
        run: npm audit

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - name: Rustfmt
        run: cargo fmt --all -- --check
        working-directory: indexer
      - name: Cargo test
        run: cargo test --all-targets
        working-directory: indexer
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: indexer
