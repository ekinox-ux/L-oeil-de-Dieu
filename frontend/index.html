<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' https://logos.haveibeenpwned.com; connect-src 'self' http://localhost:8500 http://127.0.0.1:8500">
    <title>L'Oeil de Dieu</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>

    <canvas id="iris-canvas" aria-hidden="true"></canvas>
    <div class="iris-glow" aria-hidden="true"></div>
    <div class="iris-floor" aria-hidden="true"></div>

    <div id="app">
        <div id="hero" class="state-active">
            <header class="iris-bar hero-bar">
                <a href="index.html" class="iris-brand">
                    <span class="brand-eye" data-eye="logo" aria-hidden="true">
                        <span class="eye-halo"></span>
                        <span class="eye-lid">
                            <span class="eye-ball"><span class="eye-gaze"><span class="eye-glint"></span></span></span>
                            <svg class="eye-outline" width="34" height="22" viewBox="0 0 34 22"><path class="eye-line" d="M0 11 Q17 -9 34 11 Q17 31 0 11 Z"/></svg>
                        </span>
                    </span>
                    <span>L'OEIL DE DIEU</span>
                </a>
                <nav class="header-nav" aria-label="Navigation principale">
                    <a href="index.html" class="nav-link nav-active" aria-current="page">Recherche</a>
                    <a href="stats.html" class="nav-link">Statistiques</a>
                    <a href="maintenance.html" class="nav-link">Maintenance</a>
                </nav>
                <div class="status-chip">
                    <span class="pulse-dot"></span>
                    <span id="hero-system-status">Connexion backend...</span>
                </div>
            </header>

            <div class="hero-content">
                <div class="iris-orb" data-eye="main" aria-hidden="true">
                    <div class="iris-gyro">
                        <div class="iris-axis iris-axis-x"><div class="iris-ring iris-ring-1"><span class="iris-sat"></span></div></div>
                        <div class="iris-axis iris-axis-y"><div class="iris-ring iris-ring-2"></div></div>
                        <div class="iris-axis iris-axis-t"><div class="iris-ring iris-ring-3"></div></div>
                        <div class="eye">
                            <div class="eye-halo"></div>
                            <div class="eye-lid">
                                <div class="eye-ball">
                                    <div class="eye-gaze">
                                        <div class="eye-ticks"></div>
                                        <div class="eye-iris"></div>
                                        <div class="eye-sweep"></div>
                                        <div class="eye-pupil"></div>
                                        <div class="eye-glint"></div>
                                        <div class="eye-glint eye-glint-2"></div>
                                    </div>
                                    <div class="eye-shade"></div>
                                </div>
                                <svg class="eye-outline" width="264" height="152" viewBox="0 0 264 152">
                                    <path class="eye-line" d="M0 76 Q132 -60 264 76 Q132 212 0 76 Z"/>
                                    <path class="eye-crease" d="M20 54 Q132 -70 244 54"/>
                                    <path class="eye-marks" d="M-30 76 H-8 M272 76 H294"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="hero-logo">
                    <h1 class="hero-title">Que doit voir l'Oeil ?</h1>
                    <p class="hero-subtitle">Systeme d'investigation avancee</p>
                </div>

                <div class="search-container">
                    <div class="index-selector-row">
                        <label for="index-select" class="sr-only">Index a interroger</label>
                        <select id="index-select" class="index-select">
                            <option value="">Chargement...</option>
                        </select>
                    </div>
                    <div class="search-frame">
                        <div class="search-bar" id="search-bar-hero">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="7"/>
                                <path d="m20 20-3.5-3.5"/>
                            </svg>
                            <label for="search-input" class="sr-only">Requete</label>
                            <input type="text" id="search-input" placeholder="email, telephone, nom, pseudo..." autocomplete="off" spellcheck="false">
                            <button type="button" class="search-submit" id="search-submit">Scanner <kbd class="search-kbd">Entree</kbd></button>
                        </div>
                    </div>
                </div>

                <div class="hero-kpi">
                    <div class="hero-kpi-item">
                        <span class="hero-kpi-value" data-target="0">0</span>
                        <span class="hero-kpi-label">documents</span>
                    </div>
                    <div class="hero-kpi-item">
                        <span class="hero-kpi-value" data-target="0">0</span>
                        <span class="hero-kpi-label">segments</span>
                    </div>
                    <div class="hero-kpi-item">
                        <span class="hero-kpi-value" data-target="0" data-sizetext="">0</span>
                        <span class="hero-kpi-label">taille index</span>
                    </div>
                </div>

                <div class="hero-status">
                    <div class="status-chip">
                        <span id="hero-index-status">Aucun index pret</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="results-view" class="state-hidden">
            <header id="app-header">
                <div class="header-inner">
                    <a href="#" class="header-logo" id="btn-home">
                        <span class="brand-eye" data-eye="logo" aria-hidden="true">
                            <span class="eye-halo"></span>
                            <span class="eye-lid">
                                <span class="eye-ball"><span class="eye-gaze"><span class="eye-glint"></span></span></span>
                                <svg class="eye-outline" width="34" height="22" viewBox="0 0 34 22"><path class="eye-line" d="M0 11 Q17 -9 34 11 Q17 31 0 11 Z"/></svg>
                            </span>
                        </span>
                        <span>L'OEIL DE DIEU</span>
                    </a>
                    <div class="search-frame compact">
                        <div class="search-bar compact" id="search-bar-header">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="7"/>
                                <path d="m20 20-3.5-3.5"/>
                            </svg>
                            <label for="search-input-header" class="sr-only">Requete</label>
                            <input type="text" id="search-input-header" placeholder="Rechercher..." autocomplete="off" spellcheck="false">
                            <button type="button" class="search-submit" id="search-submit-header">Scanner</button>
                        </div>
                    </div>
                    <nav class="header-nav" aria-label="Navigation principale">
                        <a href="stats.html" class="nav-link">Statistiques</a>
                        <a href="maintenance.html" class="nav-link">Maintenance</a>
                    </nav>
                    <div class="header-status">
                        <span class="pulse-dot"></span>
                        <span id="header-system-status">Connexion backend...</span>
                    </div>
                </div>
            </header>

            <main id="results-main">
                <div id="results-meta">
                    <span id="results-count"></span>
                    <span id="results-time"></span>
                </div>
                <div id="results-list"></div>
            </main>
        </div>
    </div>

    <div id="scan-line" aria-hidden="true"></div>

    <script src="js/config.js?v=6"></script>
    <script src="js/app-utils.js?v=6"></script>
    <script src="js/effects.js?v=6"></script>
    <script src="js/search-api.js?v=5"></script>
    <script src="js/search-components.js?v=5"></script>
    <script src="js/search.js?v=6"></script>
    <script src="js/iris.js?v=1"></script>
</body>
</html>
