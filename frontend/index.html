<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' https://logos.haveibeenpwned.com; connect-src 'self' http://localhost:8500 http://127.0.0.1:8500">
    <title>L'Oeil de Dieu</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Oxanium:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="bg-layer" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="scanlines"></div>
    </div>

    <div id="cursor-glow" aria-hidden="true"></div>

    <div id="app">
        <div id="hero" class="state-active">
            <div class="hero-content">
                <div class="radar-container" aria-hidden="true">
                    <div class="radar-ring radar-ring-1"></div>
                    <div class="radar-ring radar-ring-2"></div>
                    <div class="radar-ring radar-ring-3"></div>
                    <div class="radar-sweep"></div>
                </div>

                <div class="hero-logo">
                    <h1 class="hero-title">L'OEIL DE DIEU</h1>
                    <p class="hero-subtitle">Systeme d'investigation avancee</p>
                </div>

                <div class="search-container">
                    <div class="index-selector-row">
                        <select id="index-select" class="index-select">
                            <option value="">Chargement...</option>
                        </select>
                    </div>
                    <div class="search-bar" id="search-bar-hero">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                        <input type="text" id="search-input" placeholder="Entrez votre requete..." autocomplete="off" spellcheck="false">
                        <kbd class="search-kbd">Entree</kbd>
                    </div>
                </div>

                <div class="hero-kpi">
                    <div class="hero-kpi-item">
                        <span class="hero-kpi-value" data-target="0">0</span>
                        <span class="hero-kpi-label">documents</span>
                    </div>
                    <div class="hero-kpi-sep"></div>
                    <div class="hero-kpi-item">
                        <span class="hero-kpi-value" data-target="0">0</span>
                        <span class="hero-kpi-label">segments</span>
                    </div>
                    <div class="hero-kpi-sep"></div>
                    <div class="hero-kpi-item">
                        <span class="hero-kpi-value" data-target="0" data-sizetext="">0</span>
                        <span class="hero-kpi-label">taille index</span>
                    </div>
                </div>

                <div class="hero-status">
                    <div class="status-chip">
                        <span class="pulse-dot"></span>
                        <span id="hero-system-status">Connexion backend...</span>
                    </div>
                    <span class="status-sep">/</span>
                    <div class="status-chip">
                        <span id="hero-index-status">Aucun index pret</span>
                    </div>
                    <span class="status-sep">/</span>
                    <a href="stats.html" class="status-chip status-link">Statistiques</a>
                    <span class="status-sep">/</span>
                    <a href="maintenance.html" class="status-chip status-link">Maintenance</a>
                </div>

            </div>
        </div>

        <div id="results-view" class="state-hidden">
            <header id="app-header">
                <div class="header-inner">
                    <a href="#" class="header-logo" id="btn-home">L'OEIL DE DIEU</a>
                    <nav class="header-nav">
                        <a href="stats.html" class="nav-link">Statistiques</a>
                        <a href="maintenance.html" class="nav-link">Maintenance</a>
                    </nav>
                    <div class="search-bar compact" id="search-bar-header">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                        <input type="text" id="search-input-header" placeholder="Rechercher..." autocomplete="off" spellcheck="false">
                    </div>
                    <div class="header-status">
                        <span class="pulse-dot"></span>
                        <span id="header-system-status">Connexion backend...</span>
                    </div>
                </div>
            </header>

            <main id="results-main">
                <div id="results-meta">
                    <span id="results-count"></span>
                    <span id="results-time"></span>
                </div>
                <div id="results-list"></div>
            </main>
        </div>
    </div>

    <div id="scan-line" aria-hidden="true"></div>

    <script src="js/config.js?v=6"></script>
    <script src="js/app-utils.js?v=6"></script>
    <script src="js/effects.js?v=5"></script>
    <script src="js/search-api.js?v=5"></script>
    <script src="js/search-components.js?v=5"></script>
    <script src="js/search.js?v=5"></script>
</body>
</html>
